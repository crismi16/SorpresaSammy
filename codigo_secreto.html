
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8dce5">
    <title>Un secreto para ti ♥</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            font-family: Georgia, serif;
            background:
                radial-gradient(circle at 15% 20%, #fff4f6, transparent 35%),
                radial-gradient(circle at 85% 80%, #f3cbd9, transparent 40%),
                #f8e1e8;
            overflow-x: hidden;
            color: #805768;
        }

        /* CORAZONES FLOTANTES */

        .hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .hearts span {
            position: absolute;
            color: #d99aaf;
            opacity: .65;
            animation: float 7s ease-in-out infinite;
        }

        /* Corazones de la izquierda */
        .hearts span:nth-child(1)  { top: 8%; left: 8%; font-size: 25px; }
        .hearts span:nth-child(2)  { top: 22%; left: 18%; font-size: 18px; }
        .hearts span:nth-child(3)  { top: 38%; left: 6%; font-size: 32px; }
        .hearts span:nth-child(4)  { top: 55%; left: 16%; font-size: 22px; }
        .hearts span:nth-child(5)  { top: 72%; left: 7%; font-size: 28px; }
        .hearts span:nth-child(6)  { top: 88%; left: 19%; font-size: 20px; }

        /* Corazones de la derecha */
        .hearts span:nth-child(7)  { top: 10%; right: 8%; font-size: 30px; }
        .hearts span:nth-child(8)  { top: 25%; right: 18%; font-size: 20px; }
        .hearts span:nth-child(9)  { top: 42%; right: 6%; font-size: 26px; }
        .hearts span:nth-child(10) { top: 58%; right: 17%; font-size: 32px; }
        .hearts span:nth-child(11) { top: 75%; right: 7%; font-size: 19px; }
        .hearts span:nth-child(12) { top: 90%; right: 19%; font-size: 27px; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-25px);
            }
        }

        /* TARJETA */

        .card {
            position: relative;
            width: 100%;
            max-width: 430px;
            padding: 42px 30px;
            text-align: center;
            background: #fffaf2;
            border: 1px solid #ead5cb;
            border-radius: 8px;
            box-shadow:
                0 15px 45px rgba(126, 77, 91, .15),
                inset 0 0 25px rgba(230, 198, 180, .15);
            z-index: 1;
        }

        .decoration {
            color: #cf8ca5;
            font-size: 24px;
            letter-spacing: 8px;
            margin-bottom: 18px;
        }

        .lock {
            font-size: 43px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 29px;
            font-weight: normal;
            color: #a66d83;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 14px;
            line-height: 1.7;
            color: #987987;
            margin-bottom: 27px;
        }

        /* CAMPO DEL CÓDIGO */

        .password-container {
            position: relative;
            width: 100%;
        }

        .code-input {
            width: 100%;
            padding: 14px 45px 14px 14px;
            border: 1px solid #e4c3cf;
            border-radius: 5px;
            outline: none;
            background: #fffdfb;
            color: #805768;
            text-align: center;
            font-family: Georgia, serif;
            font-size: 16px;
            letter-spacing: 3px;
            transition: border .3s;
        }

        .code-input:focus {
            border-color: #c887a0;
        }

        /* BOTÓN DEL MONITO */

        .eye-button {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 19px;
            color: #b87991;
            padding: 5px;
        }

        .eye-button:hover {
            color: #d8799e;
        }

        /* BOTÓN DE DESBLOQUEO */

        .unlock-button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 5px;
            background: #d99aaf;
            color: white;
            font-family: Georgia, serif;
            font-size: 15px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: .3s;
        }

        .unlock-button:hover {
            background: #c47e98;
            transform: translateY(-2px);
        }

        .error {
            min-height: 22px;
            margin-top: 12px;
            font-size: 13px;
            color: #bd7188;
        }

        /* MENSAJE SECRETO */

        .secret-message {
            display: none;
            margin-top: 25px;
            padding: 23px 18px;
            border-top: 1px solid #ead5cb;
            animation: appear 1s ease forwards;
        }

        .secret-message h2 {
            font-size: 24px;
            font-weight: normal;
            color: #a66d83;
            margin-bottom: 15px;
        }

        .secret-message p {
            font-size: 15px;
            line-height: 1.9;
            color: #806477;
        }

        .secret-message .heart {
            display: block;
            margin-top: 18px;
            font-size: 25px;
            color: #cf8ca5;
        }

                .secret-message video {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin-top: 15px;
            box-shadow: 0 5px 18px rgba(126, 77, 91, .15);
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* RESPONSIVE */

        @media (max-width: 480px) {
            .card {
                padding: 35px 22px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- CORAZONES -->
    <div class="hearts">
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
    </div>

    <!-- TARJETA PRINCIPAL -->
    <main class="card">

        <div class="decoration">✿ ♡ ✿</div>

        <div class="lock" id="lock">🔒</div>

        <h1>Un pequeño secreto...</h1>

        <p class="subtitle">
            Hay algo más que quiero compartir contigo.
            Pero primero tendrás que descubrir el código correcto.
        </p>

        <!-- FORMULARIO DEL CÓDIGO -->
        <form id="secretForm">

            <div class="password-container">

                <input
                    type="password"
                    id="secretCode"
                    class="code-input"
                    placeholder="Escribe el código..."
                    autocomplete="off"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                    class="eye-button"
                    aria-label="Mostrar código"
                >🙈</button>

            </div>

            <button type="submit" class="unlock-button">
                Descubrir secreto ♥
            </button>

        </form>

        <p class="error" id="error"></p>

        <!-- MENSAJE DESBLOQUEADO -->
        <section class="secret-message" id="secretMessage">

            <h2>¡Lo descubriste! ♡</h2>

            <p>
                Aquí comienza otra pequeña sorpresa...
                <br><br>
            </p>

            <video id="secretVideo" controls playsinline preload="metadata">
                <source src="img/video.mp4" type="video/mp4">
                Tu navegador no admite la reproducción de este video.
            </video>

            <span class="heart">♥</span>

        </section>

        <div class="decoration" style="margin-top:25px;">
            ♡ ✿ ♡
        </div>

    </main>

    <script>
        const secretForm = document.getElementById("secretForm");
        const secretCode = document.getElementById("secretCode");
        const secretMessage = document.getElementById("secretMessage");
        const error = document.getElementById("error");
        const togglePassword = document.getElementById("togglePassword");
        const lock = document.getElementById("lock");

        // CÓDIGO SECRETO
        const correctCode = "111016";

        // MOSTRAR U OCULTAR EL CÓDIGO
        togglePassword.addEventListener("click", function() {

            const isHidden = secretCode.type === "password";

            secretCode.type = isHidden ? "text" : "password";

            togglePassword.textContent = isHidden ? "🙉" : "🙈";

            togglePassword.setAttribute(
                "aria-label",
                isHidden ? "Ocultar código" : "Mostrar código"
            );

        });

        // VALIDAR EL CÓDIGO
        secretForm.addEventListener("submit", function(event) {

            event.preventDefault();

            if (secretCode.value.trim().toUpperCase() === correctCode) {

                secretMessage.style.display = "block";
                error.textContent = "";
                secretForm.style.display = "none";
                lock.textContent = "🔓";
                document.getElementById("secretVideo").play();
            } else {

                error.textContent = "Ese no es el código... inténtalo otra vez ♡";
                secretCode.value = "";

            }

        });
    </script>

</body>
</html>
